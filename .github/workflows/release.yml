name: Release

# Publishes the desktop app as downloadable installers (Linux AppImage + .deb)
# attached to a GitHub Release. Trigger by pushing a version tag whose number
# matches packages/desktop/package.json, e.g.:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
on:
  push:
    tags:
      - "v*"

# electron-builder needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  linux:
    name: Build & publish Linux installers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # pnpm version is read from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Builds the renderer + electron bundle, then runs electron-builder with
      # --publish always, which creates/updates the GitHub Release for this tag
      # and uploads the AppImage and .deb. GH_TOKEN authenticates the upload.
      - name: Build & publish
        run: pnpm --filter @tp-scroll/desktop run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
